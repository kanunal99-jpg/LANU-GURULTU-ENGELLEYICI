name: Takilan Android testini durdur
on:
  push:
    branches: ['codex/android-apk-20261014']
    paths: ['.github/workflows/recovery.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-stalled-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sadece bilinen takilan testi durdur
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 38618937682 --repo "$GITHUB_REPOSITORY"
