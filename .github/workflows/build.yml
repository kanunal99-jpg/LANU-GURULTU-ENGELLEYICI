name: APK derle ve doğrula
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANU_VERSION_CODE: ${{ github.run_number }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Arama yaşam döngüsü testleri
        run: node --test tests/*.test.cjs
      - name: Yerel PeerJS bütünlüğü
        run: echo 'ad5d8870d1e389914f9cba8d35be313c4327c69ee0a221e482e9bf7621136fe5  app/src/main/assets/vendor/peerjs.min.js' | sha256sum -c -
      - name: İki istemci WebRTC ses bağlantısı
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          export LANU_CHROME_EXECUTABLE="$(command -v google-chrome)"
          npm run test:webrtc
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Derle ve lint
        run: gradle assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - name: KVM erişimi
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatör için disk alanı
        run: |
          sudo rm -rf "$ANDROID_HOME/ndk" /usr/share/dotnet /opt/ghc
          df -h .
      - name: Android WebView smoke testi
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon
      - name: APK imzası ve içerik doğrulaması
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Lanu-Lens-2.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Lanu-Lens-2.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Lanu-Lens-2.0.0.apk > dist/APK-BILGILERI.txt
          unzip -l dist/Lanu-Lens-2.0.0.apk | grep -E 'assets/(index.html|app.js|vendor/peerjs.min.js)'
          cd dist
          sha256sum Lanu-Lens-2.0.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lanu-Lens-APK-ve-test-raporlari
          path: |
            dist/
            app/build/reports/
            app/build/outputs/androidTest-results/
            test-results/
          if-no-files-found: warn
      - name: Releases'a APK ekle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.0-build${GITHUB_RUN_NUMBER}" dist/Lanu-Lens-2.0.0.apk dist/SHA256SUMS.txt dist/APK-BILGILERI.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Lanu Lens 2.0.0" --notes-file docs/RELEASE-NOTES.md
