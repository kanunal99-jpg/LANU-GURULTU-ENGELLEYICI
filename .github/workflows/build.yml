name: APK derle ve doğrula
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANU_VERSION_CODE: ${{ github.run_number }}
      LANU_OTA_MANIFEST_URL: ${{ vars.LANU_OTA_MANIFEST_URL }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Arama yaşam döngüsü testleri
        run: node --test tests/*.test.cjs
      - name: OTA yayıncısı sözdizimi
        run: bash -n scripts/publish-ota.sh
      - name: Yerel PeerJS bütünlüğü
        run: echo 'ad5d8870d1e389914f9cba8d35be313c4327c69ee0a221e482e9bf7621136fe5  app/src/main/assets/vendor/peerjs.min.js' | sha256sum -c -
      - name: İki istemci WebRTC ses bağlantısı
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          export LANU_CHROME_EXECUTABLE="$(command -v google-chrome)"
          npm run test:webrtc
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Derle ve lint
        run: gradle assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - name: KVM erişimi
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatör için disk alanı
        run: |
          sudo rm -rf "$ANDROID_HOME/ndk" /usr/share/dotnet /opt/ghc
          df -h .
      - name: Android WebView smoke testi
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon
      # Production OTA requires the same secret-backed signing key on every run.
      # Never upload a debug-signed APK to the public OTA feed.
      - name: Kalıcı imzalama anahtarı (varsa)
        if: github.event_name != 'pull_request'
        id: signing
        env:
          STORE_B64: ${{ secrets.LANU_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LANU_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LANU_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LANU_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$STORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            umask 077
            echo "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/lanu-release.jks"
            echo "LANU_SIGNING_STORE_FILE=$RUNNER_TEMP/lanu-release.jks" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production signing secrets missing: publishing a debug-signed prerelease, NOT OTA-compatible."
          fi
      - name: OTA imzalama koşulları
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_TOKEN: ${{ secrets.LANU_OTA_PUBLISH_TOKEN }}
          PINNED_CERT: ${{ vars.LANU_RELEASE_CERT_SHA256 }}
          OTA_FEED: ${{ vars.LANU_OTA_MANIFEST_URL }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [[ -n "$PUBLIC_TOKEN" ]]; then
            if [[ "$SIGNED" != "true" || -z "$PINNED_CERT" || -z "$OTA_FEED" ]]; then
              echo "::error::OTA publishing requires a stable release signing key, pinned certificate and a public feed."
              exit 1
            fi
          fi
      - name: APK imzası ve içerik doğrulaması
        run: |
          mkdir -p dist
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk dist/Lanu-Lens-2.0.6.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/Lanu-Lens-2.0.6.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Lanu-Lens-2.0.6.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Lanu-Lens-2.0.6.apk > dist/APK-BILGILERI.txt
          unzip -l dist/Lanu-Lens-2.0.6.apk | grep -E 'assets/(index.html|app.js|vendor/peerjs.min.js)'
          cd dist
          sha256sum Lanu-Lens-2.0.6.apk > SHA256SUMS.txt
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            HASH="$(sha256sum Lanu-Lens-2.0.6.apk | cut -d' ' -f1)"
            SIZE="$(stat -c%s Lanu-Lens-2.0.6.apk)"
            cat > latest.json <<EOF
          {"schema":1,"versionCode":${GITHUB_RUN_NUMBER},"versionName":"2.0.6","apkUrl":"https://github.com/kanunal99-jpg/LANU-LENS-OTA/releases/download/v2.0.6-build${GITHUB_RUN_NUMBER}/Lanu-Lens-2.0.6.apk","sha256":"${HASH}","sizeBytes":${SIZE}}
          EOF
            echo "latest.json prepared as an artifact. Publish APK + manifest to a separate PUBLIC binary-only distribution repository before activating OTA."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lanu-Lens-APK-ve-test-raporlari
          path: |
            dist/
            app/build/reports/
            app/build/outputs/androidTest-results/
            test-results/
          if-no-files-found: warn
      - name: Releases'a APK ekle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.6-build${GITHUB_RUN_NUMBER}" dist/Lanu-Lens-2.0.6.apk dist/SHA256SUMS.txt dist/APK-BILGILERI.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Lanu Lens 2.0.6" --notes-file docs/RELEASE-NOTES.md
      - name: OTA herkese açık sadece-APK dağıtımı
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.LANU_OTA_PUBLISH_TOKEN }}
          OTA_APK: dist/Lanu-Lens-2.0.6.apk
          OTA_VERSION: "2.0.6"
          LANU_RELEASE_CERT_SHA256: ${{ vars.LANU_RELEASE_CERT_SHA256 }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::Public distribution token missing: private release built, OTA remains unconfigured."
            exit 0
          fi
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          bash scripts/publish-ota.sh
