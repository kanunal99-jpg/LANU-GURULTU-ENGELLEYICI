name: APK derle ve doğrula
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANU_VERSION_CODE: ${{ github.run_number }}
      LANU_OTA_MANIFEST_URL: ${{ vars.LANU_OTA_MANIFEST_URL }}
      LANU_RELEASE_CERT_SHA256: ${{ vars.LANU_RELEASE_CERT_SHA256 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Arama yaşam döngüsü testleri
        run: node --test tests/*.test.cjs
      - name: OTA ve APK doğrulayıcı sözdizimi
        run: bash -n scripts/publish-ota.sh scripts/verify-release-apk.sh scripts/verify-draft-release-assets.sh scripts/verify-installed-ota-compatibility.sh
      - name: Yerel PeerJS bütünlüğü
        run: echo 'ad5d8870d1e389914f9cba8d35be313c4327c69ee0a221e482e9bf7621136fe5  app/src/main/assets/vendor/peerjs.min.js' | sha256sum -c -
      - name: İki istemci WebRTC ses bağlantısı
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          export LANU_CHROME_EXECUTABLE="$(command -v google-chrome)"
          npm run test:webrtc
      - name: Bağımlılık güvenlik denetimi
        run: npm audit --audit-level=high --no-fund
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      # Verify the production variant on every PR, even without release
      # signing secrets. AssembleRelease may be unsigned on PR, but it catches
      # resource/manifest/Java differences before a production publication.
      - name: Debug + production derleme ve lint
        run: gradle assembleDebug assembleDebugAndroidTest assembleRelease lintDebug lintRelease --no-daemon
      - name: R8 release APK ve JS köprü imzası doğrulaması
        run: |
          test -s app/build/outputs/mapping/release/mapping.txt
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -p "$APK" 'classes*.dex' > "$RUNNER_TEMP/release-classes.dex"
          for method in setPrivateUnlocked downloadAndInstall requestCallNotificationPermission setCallActive savePhoto; do
            # DEX encodes a ULEB128 length before each UTF-8 method name; for
            # long names the prefix can be a printable ASCII character.
            if ! strings "$RUNNER_TEMP/release-classes.dex" | grep -Fq "$method"; then
              echo "::error::R8 removed or renamed JS bridge method: $method"
              exit 1
            fi
          done
          echo "R8 mapping exists and native JavaScript bridge entrypoints are preserved."
      - name: KVM erişimi
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatör için disk alanı
        run: |
          sudo rm -rf "$ANDROID_HOME/ndk" /usr/share/dotnet /opt/ghc
          df -h .
      - name: Android WebView smoke testi
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon
      # Production OTA requires the same secret-backed signing key on every run.
      # Never upload a debug-signed APK to the public OTA feed.
      - name: Kalıcı imzalama anahtarı (varsa)
        if: github.event_name != 'pull_request'
        id: signing
        env:
          STORE_B64: ${{ secrets.LANU_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LANU_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LANU_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LANU_RELEASE_KEY_PASSWORD }}
        run: |
          configured=0
          for secret in "$STORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -n "$secret" ]]; then configured=$((configured+1)); fi
          done
          if [[ "$configured" -gt 0 && "$configured" -lt 4 ]]; then
            echo "::error::Incomplete release signing configuration; refusing a debug-signed fallback."
            exit 1
          fi
          if [[ "$configured" -eq 4 ]]; then
            umask 077
            echo "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/lanu-release.jks"
            echo "LANU_SIGNING_STORE_FILE=$RUNNER_TEMP/lanu-release.jks" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production signing secrets missing: publishing a debug-signed prerelease, NOT OTA-compatible."
          fi
      - name: OTA imzalama koşulları
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_TOKEN: ${{ secrets.LANU_OTA_PUBLISH_TOKEN }}
          PINNED_CERT: ${{ vars.LANU_RELEASE_CERT_SHA256 }}
          OTA_FEED: ${{ vars.LANU_OTA_MANIFEST_URL }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [[ "$SIGNED" == "true" || -n "$PUBLIC_TOKEN" || -n "$PINNED_CERT" ]]; then
            if [[ "$SIGNED" != "true" || -z "$PUBLIC_TOKEN" || -z "$PINNED_CERT" || -z "$OTA_FEED" ]]; then
              echo "::error::Production OTA is only allowed with all signing secrets, public publisher token, certificate and feed configured."
              exit 1
            fi
          fi
      - name: APK imzası ve içerik doğrulaması
        run: |
          mkdir -p dist
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk dist/Lanu-Lens-2.0.10.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/Lanu-Lens-2.0.10.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Lanu-Lens-2.0.10.apk
          # Re-check the *actual* binary signer BEFORE the private release and
          # before public OTA publication; matching Gradle config is not proof.
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            expected="$(printf '%s' "$LANU_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/Lanu-Lens-2.0.10.apk | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
              echo "::error::Production signer digest does not match pinned certificate. Refusing release."
              exit 1
            fi
            echo "Production APK signer verified against the configured fingerprint."
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Lanu-Lens-2.0.10.apk > dist/APK-BILGILERI.txt
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then mode=PRODUCTION; else mode=DEBUG; fi
          bash scripts/verify-release-apk.sh dist/Lanu-Lens-2.0.10.apk "$mode" "$GITHUB_RUN_NUMBER" "2.0.10" > dist/APK-IMZA-DURUMU.txt
          cat dist/APK-IMZA-DURUMU.txt
          unzip -l dist/Lanu-Lens-2.0.10.apk | grep -E 'assets/(index.html|app.js|vendor/peerjs.min.js)'
          cd dist
          sha256sum Lanu-Lens-2.0.10.apk > SHA256SUMS.txt
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            HASH="$(sha256sum Lanu-Lens-2.0.10.apk | cut -d' ' -f1)"
            SIZE="$(stat -c%s Lanu-Lens-2.0.10.apk)"
            cat > latest.json <<EOF
          {"schema":1,"versionCode":${GITHUB_RUN_NUMBER},"versionName":"2.0.10","apkUrl":"https://github.com/kanunal99-jpg/LANU-LENS-OTA/releases/download/v2.0.10-build${GITHUB_RUN_NUMBER}/Lanu-Lens-2.0.10.apk","sha256":"${HASH}","sizeBytes":${SIZE}}
          EOF
            echo "latest.json prepared as an artifact. Publish APK + manifest to a separate PUBLIC binary-only distribution repository before activating OTA."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lanu-Lens-APK-ve-test-raporlari
          path: |
            dist/
            app/build/reports/
            app/build/outputs/mapping/release/
            app/build/outputs/androidTest-results/
            test-results/
          if-no-files-found: warn
      - name: Releases'a APK ekle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.10-build${GITHUB_RUN_NUMBER}" dist/Lanu-Lens-2.0.10.apk dist/SHA256SUMS.txt dist/APK-BILGILERI.txt dist/APK-IMZA-DURUMU.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Lanu Lens 2.0.10" --notes-file docs/RELEASE-NOTES.md
      - name: GitHub Release APK'yi uzaktan kanıtla
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Private source repo release MUST expose all 4 binary/evidence assets.
          verified=false
          for attempt in 1 2 3 4 5; do
            mkdir -p "$RUNNER_TEMP/lanu-release-readback"
            # GitHub's by-tag release endpoint returns HTTP 404 for an
            # unpublished DRAFT. Resolve it from the authenticated owner index
            # while preserving the private draft until all remote bytes match.
            if gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/lanu-releases.json" &&
               jq -er --arg tag "v2.0.10-build${GITHUB_RUN_NUMBER}" '[.[]|select(.tag_name==$tag and .draft==true)]|if length==1 then .[0] else error("Expected exactly one draft release") end' "$RUNNER_TEMP/lanu-releases.json" > "$RUNNER_TEMP/lanu-release.json" &&
               node scripts/verify-release-evidence.cjs "$RUNNER_TEMP/lanu-release.json" dist "$GITHUB_SHA" &&
               bash scripts/verify-draft-release-assets.sh "$RUNNER_TEMP/lanu-release.json" dist "$RUNNER_TEMP/lanu-release-readback" "$GITHUB_REPOSITORY"; then
              echo "Release draft assets were remotely retrieved and verified."
              verified=true
              break
            fi
            # Remote GitHub Release asset indexing may be eventually
            # consistent. Delay briefly but NEVER mark absent assets green.
            sleep "$((attempt * 3))"
          done
          if [[ "$verified" != true ]]; then
            echo "::error::Release APK and signing evidence could not be verified; release remains a non-public draft"
            exit 1
          fi
      - name: Doğrulanmış APK Release yayınını aç
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the release invisible until remote asset readback and SHA-256 pass.
          # A debug-signed APK is always labeled as a non-production prerelease.
          release_id="$(jq -er '.id|select(type=="number" and .>0)' "$RUNNER_TEMP/lanu-release.json")"
          # Publish only the exact numeric draft ID already read back.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false -F prerelease=true --jq '.draft' | grep -x false

      - name: OTA herkese açık sadece-APK dağıtımı
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.LANU_OTA_PUBLISH_TOKEN }}
          OTA_APK: dist/Lanu-Lens-2.0.10.apk
          OTA_VERSION: "2.0.10"
          LANU_RELEASE_CERT_SHA256: ${{ vars.LANU_RELEASE_CERT_SHA256 }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::Public distribution token missing: private release built, OTA remains unconfigured."
            exit 0
          fi
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          bash scripts/publish-ota.sh

  # Android 10 OTA compatibility is a separate emulator job; an API 35
  # smoke test alone cannot establish the lower-bound behaviour.
  ota-android10:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LANU_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Android 10 için APK ve test derle
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle assembleDebug assembleDebugAndroidTest --no-daemon
      - name: KVM erişimi (Android 10)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 10 emülatör alanı
        run: sudo rm -rf "$ANDROID_HOME/ndk" /usr/share/dotnet /opt/ghc
      - name: Android 10 gerçek emülatör smoke (API 29)
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANU-OTA-Android10-test-raporlari
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
