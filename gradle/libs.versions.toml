# Single source of truth for Android build and dependency versions.
# Upgrade dependency versions with Android build/lint/emulator smoke evidence.
[versions]
agp = "8.9.2"
androidxCore = "1.13.1"
androidxWebkit = "1.11.0"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
